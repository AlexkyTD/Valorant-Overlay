<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT Overlay — Hex Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --val-red: #FD4556;
    --val-cream: #ECE8E1;
    --val-cream-dim: #c8c4bd;
    --val-line: rgba(236,232,225,0.12);
    --font-display: 'Oswald','Bebas Neue','Anton','Impact',sans-serif;
    --font-body: 'Inter',system-ui,sans-serif;
    --font-mono: 'JetBrains Mono','Roboto Mono',ui-monospace,monospace;
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 300px;
    height: 900px;
    overflow: hidden;
    background: transparent !important;
    font-family: var(--font-body);
    color: var(--val-cream);
  }

  /* ─────────── Layout ─────────── */
  .overlay {
    position: relative;
    width: 300px;
    height: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 0 24px;
    background: linear-gradient(180deg,
      rgba(15,20,25,0) 0%,
      rgba(15,20,25,0.78) 7%,
      rgba(10,14,18,0.88) 50%,
      rgba(15,20,25,0.78) 93%,
      rgba(15,20,25,0) 100%);
    backdrop-filter: blur(2px);
  }

  /* ─────────── Counter pill ─────────── */
  .ov-counter {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    padding: 5px 14px;
    border: 1px solid var(--val-line);
    border-radius: 14px;
    background: rgba(15,20,25,0.5);
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
  }
  .ov-counter .num { color: var(--accent, var(--val-red)); font-weight: 600; }
  .ov-counter .sep { color: rgba(236,232,225,0.4); }
  .ov-counter .tot { color: var(--val-cream-dim); }

  /* ─────────── Hex stacks (carousel context) ─────────── */
  .hex-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .hex-sep {
    color: rgba(236,232,225,0.3);
    font-size: 10px;
    line-height: 1;
  }

  .hex-chip {
    appearance: none;
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s ease, filter 0.18s ease;
    filter: saturate(0.7) brightness(0.85);
  }
  .hex-chip:hover { transform: scale(1.08); filter: saturate(1) brightness(1); }
  .hex-chip svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hex-chip img {
    position: relative;
    width: 78%;
    height: 78%;
    object-fit: cover;
    object-position: top center;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  .hex-chip.size-sm { width: 38px; height: 44px; opacity: 0.6; }
  .hex-chip.size-md { width: 52px; height: 60px; opacity: 0.85; }

  /* ─────────── Hero (rect frame + aura) ─────────── */
  .hero-zone {
    position: relative;
    margin: 18px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: visible;
  }

  .hero-frame-wrap {
    position: relative;
    width: 108px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Aura container — extends well past the rect frame so the
     elemental decoration is the dominant visual element */
  .aura-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 270px;
    height: 270px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    animation: aura-flash 0.7s cubic-bezier(.2,.8,.2,1) both;
  }
  .aura-wrap svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes aura-flash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* Rectangle portrait frame */
  .rect-frame {
    position: relative;
    width: 108px;
    height: 150px;
    z-index: 2;
    border: 2px solid var(--accent, var(--val-red));
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 4px 28px rgba(0,0,0,0.6), 0 0 24px var(--accent-glow, rgba(253,69,86,0.3));
    background: var(--bg-grad, radial-gradient(circle at 50% 60%, #2a1410, #0a0608));
    animation: burn-in 0.55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes burn-in {
    0%   { opacity: 0; transform: translateY(8px) scale(0.94); filter: brightness(2.2) saturate(1.4); }
    40%  { opacity: 1; filter: brightness(1.6) saturate(1.3); }
    100% { opacity: 1; transform: translateY(0)  scale(1);    filter: brightness(1) saturate(1); }
  }

  .rect-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .rect-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: var(--accent, var(--val-red));
    z-index: 3;
  }
  .rect-corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid var(--accent, var(--val-red));
    z-index: 4;
  }
  .rect-corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .rect-corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .rect-corner.bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .rect-corner.br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  /* ─────────── Nameplate ─────────── */
  .nameplate {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    animation: burn-in 0.55s cubic-bezier(.2,.8,.2,1) both;
  }
  .agent-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--val-cream);
    text-shadow: 0 2px 10px rgba(0,0,0,0.6), 0 0 24px var(--accent-glow, rgba(253,69,86,0.25));
    line-height: 1;
  }
  .agent-role {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent, var(--val-red));
  }

  .element-tag {
    margin-top: 10px;
    padding: 4px 14px;
    border: 1px solid var(--accent, var(--val-red));
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.28em;
    color: var(--accent-light, var(--val-cream));
    text-transform: uppercase;
    animation: burn-in 0.55s cubic-bezier(.2,.8,.2,1) both;
  }

  /* ─────────── Aura SVG animations ─────────── */
  @keyframes flicker     { 0%,100% { transform: scaleY(1) translateY(0); opacity: .85; } 50% { transform: scaleY(1.08) translateY(-2px); opacity: 1; } }
  @keyframes flicker-2   { 0%,100% { opacity: .5; transform: scaleY(.96); } 50% { opacity: .9; transform: scaleY(1.06); } }
  @keyframes swirl       { 0%,100% { transform: translateX(0); opacity: .85; } 50% { transform: translateX(3px); opacity: 1; } }
  @keyframes bubble      { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes drift       { 0%,100% { transform: translateX(0) translateY(0); opacity: .7; } 50% { transform: translateX(2px) translateY(-2px); opacity: .9; } }
  @keyframes pulse-anim  { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
  @keyframes blink-anim  { 0%,100% { opacity: 1; } 60% { opacity: .3; } }
  @keyframes float-anim  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes scan-line   { 0% { transform: translateY(-30px); opacity: 0; } 50% { opacity: .6; } 100% { transform: translateY(30px); opacity: 0; } }

  .anim-flicker   { animation: flicker 1.4s ease-in-out infinite; transform-origin: 50% 50%; }
  .anim-flicker-2 { animation: flicker-2 1.1s ease-in-out infinite; transform-origin: 50% 50%; }
  .anim-swirl     { animation: swirl 3.2s ease-in-out infinite; }
  .anim-bubble    { animation: bubble 2.2s ease-in-out infinite; }
  .anim-drift     { animation: drift 4s ease-in-out infinite; }
  .anim-pulse     { animation: pulse-anim 2s ease-in-out infinite; transform-origin: 50% 50%; }
  .anim-blink     { animation: blink-anim 1.6s ease-in-out infinite; }
  .anim-float     { animation: float-anim 3.5s ease-in-out infinite; }
  .anim-scan      { animation: scan-line 2.4s linear infinite; }

  /* ─────────── Idle / loading / error ─────────── */
  .idle, .loading, .error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
  }
  .hidden { display: none !important; }
  .idle-logo {
    width: 60px; height: 60px;
    border: 2px solid var(--val-red);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
    animation: pulse-anim 2s ease-in-out infinite;
  }
  .idle-logo span { transform: rotate(-45deg); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.1em; color: var(--val-red); }
  .idle-text { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(236,232,225,0.45); }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(253,69,86,0.2); border-top-color: var(--val-red); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--val-red); font-size: 12px; letter-spacing: 0.1em; text-align: center; padding: 20px; }

  .agent-display { display: flex; flex-direction: column; align-items: center; }
  .agent-display.hidden { display: none; }

  /* keyed re-render for nameplate burn-in on switch */
  .keyed { animation: burn-in 0.55s cubic-bezier(.2,.8,.2,1) both; }
</style>
</head>
<body>
<div class="overlay" id="root">

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="idle-text">Loading agents...</div>
  </div>

  <div class="error hidden" id="error"></div>

  <div class="idle hidden" id="idle">
    <div class="idle-logo"><span>VAL</span></div>
    <div class="idle-text">Waiting for agent...</div>
  </div>

  <div class="agent-display hidden" id="display">
    <div class="ov-counter">
      <span class="num" id="counter-num">00</span>
      <span class="sep">/</span>
      <span class="tot" id="counter-tot">00</span>
    </div>

    <div class="hex-stack" id="stack-top"></div>

    <div class="hero-zone">
      <div class="hero-frame-wrap">
        <div class="aura-wrap" id="aura"></div>
        <div class="rect-frame" id="rect-frame">
          <div class="rect-corner tl"></div>
          <div class="rect-corner tr"></div>
          <div class="rect-corner bl"></div>
          <div class="rect-corner br"></div>
          <img id="portrait" alt="" draggable="false">
          <div class="rect-bar"></div>
        </div>
      </div>
      <div class="nameplate" id="nameplate">
        <div class="agent-name" id="agent-name"></div>
        <div class="agent-role" id="agent-role"></div>
      </div>
    </div>

    <div class="hex-stack" id="stack-bot"></div>

    <div class="element-tag" id="element-tag"></div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════════════════
   ELEMENT MAP — VALORANT agent → element + color palette
   (28 agents from the design ref, mapped by lowercase name)
   ════════════════════════════════════════════════════════════ */
const ELEMENT_MAP = {
  phoenix:    { el: 'fire',         primary: '#ff6a2c', secondary: '#ffb347', accent: '#ffd166', bg: 'radial-gradient(circle at 50% 60%, #5a1a08, #1a0602)' },
  jett:       { el: 'wind',         primary: '#9be7ff', secondary: '#5fc7ff', accent: '#e6faff', bg: 'radial-gradient(circle at 50% 60%, #0d3a4a, #02080d)' },
  viper:      { el: 'poison',       primary: '#5cd673', secondary: '#3a9c4a', accent: '#a4f0a8', bg: 'radial-gradient(circle at 50% 60%, #0e3a18, #020805)' },
  brimstone:  { el: 'smoke',        primary: '#d97a3a', secondary: '#8a4a22', accent: '#e6a878', bg: 'radial-gradient(circle at 50% 60%, #2a1a10, #080404)' },
  sage:       { el: 'ice',          primary: '#7df0d2', secondary: '#3ec0a8', accent: '#cffaef', bg: 'radial-gradient(circle at 50% 60%, #0a3a3a, #020a0c)' },
  sova:       { el: 'electric',     primary: '#5fb8ff', secondary: '#3a7ad9', accent: '#a8d8ff', bg: 'radial-gradient(circle at 50% 60%, #0a1e3a, #02060c)' },
  omen:       { el: 'shadow',       primary: '#6e7eff', secondary: '#3a4ad9', accent: '#b8c0ff', bg: 'radial-gradient(circle at 50% 60%, #0a0e3a, #020308)' },
  cypher:     { el: 'surveillance', primary: '#e0e0e6', secondary: '#9a9aa8', accent: '#f4f4f8', bg: 'radial-gradient(circle at 50% 60%, #1a1a22, #040408)' },
  breach:     { el: 'seismic',      primary: '#f5b042', secondary: '#a86a18', accent: '#ffd87a', bg: 'radial-gradient(circle at 50% 60%, #3a200a, #0c0602)' },
  raze:       { el: 'explosive',    primary: '#ff8a3a', secondary: '#ff4a4a', accent: '#ffd070', bg: 'radial-gradient(circle at 50% 60%, #4a1a08, #0c0402)' },
  reyna:      { el: 'soul',         primary: '#c264ff', secondary: '#7a2ad9', accent: '#e6b8ff', bg: 'radial-gradient(circle at 50% 60%, #2a0a4a, #08020c)' },
  killjoy:    { el: 'tech',         primary: '#ffd23a', secondary: '#e0a020', accent: '#fff0a0', bg: 'radial-gradient(circle at 50% 60%, #3a2a08, #080604)' },
  skye:       { el: 'nature',       primary: '#7ad06a', secondary: '#3e8a3a', accent: '#cdee8a', bg: 'radial-gradient(circle at 50% 60%, #0e2a14, #020805)' },
  yoru:       { el: 'dimension',    primary: '#5a6fff', secondary: '#9c4dff', accent: '#c8d0ff', bg: 'radial-gradient(circle at 50% 60%, #14123a, #04030c)' },
  astra:      { el: 'cosmic',       primary: '#9b6cf2', secondary: '#5a3aa8', accent: '#e2caff', bg: 'radial-gradient(circle at 50% 60%, #1a0a3a, #04020c)' },
  'kay/o':    { el: 'suppression',  primary: '#7ad0e5', secondary: '#2a6a8a', accent: '#d8f0fa', bg: 'radial-gradient(circle at 50% 60%, #0e2a3a, #02080c)' },
  chamber:    { el: 'luxury',       primary: '#f0c850', secondary: '#a07820', accent: '#fff0a8', bg: 'radial-gradient(circle at 50% 60%, #2a200a, #080604)' },
  neon:       { el: 'lightning',    primary: '#3affff', secondary: '#3a6aff', accent: '#c8faff', bg: 'radial-gradient(circle at 50% 60%, #082a3a, #02080c)' },
  fade:       { el: 'nightmare',    primary: '#c41a1a', secondary: '#1a0606', accent: '#ff5a5a', bg: 'radial-gradient(circle at 50% 60%, #200606, #040000)' },
  harbor:     { el: 'water',        primary: '#3acfff', secondary: '#2a7aa8', accent: '#a8e8ff', bg: 'radial-gradient(circle at 50% 60%, #08283a, #02080c)' },
  gekko:      { el: 'creature',     primary: '#a8e040', secondary: '#5a8a18', accent: '#daff8a', bg: 'radial-gradient(circle at 50% 60%, #1a2a08, #040802)' },
  deadlock:   { el: 'nano',         primary: '#a8d6ec', secondary: '#5a7a9a', accent: '#e0eef8', bg: 'radial-gradient(circle at 50% 60%, #1a242c, #04080a)' },
  iso:        { el: 'barrier',      primary: '#c84afc', secondary: '#6a1a9a', accent: '#e8b8ff', bg: 'radial-gradient(circle at 50% 60%, #2a0a3a, #08020c)' },
  clove:      { el: 'immortal',     primary: '#ff7ad8', secondary: '#a8348a', accent: '#ffc0e8', bg: 'radial-gradient(circle at 50% 60%, #2a0a24, #08020c)' },
  vyse:       { el: 'metal',        primary: '#c8d870', secondary: '#7a8a3a', accent: '#e8f0a8', bg: 'radial-gradient(circle at 50% 60%, #1a1a08, #040402)' },
  tejo:       { el: 'missile',      primary: '#f0a020', secondary: '#a06010', accent: '#ffd07a', bg: 'radial-gradient(circle at 50% 60%, #2a1a08, #080604)' },
  waylay:     { el: 'radiance',     primary: '#ff80a8', secondary: '#c84a78', accent: '#ffc8da', bg: 'radial-gradient(circle at 50% 60%, #2a0a18, #08020a)' },
  veto:       { el: 'stealth',      primary: '#7a90ff', secondary: '#3a4aa8', accent: '#c0d0ff', bg: 'radial-gradient(circle at 50% 60%, #0a142a, #02040c)' },
};
const FALLBACK = { el: 'fire', primary: '#FD4556', secondary: '#FF8A65', accent: '#FFD54F', bg: 'radial-gradient(circle at 50% 60%, #2a0a14, #08020c)' };

/* ════════════════════════════════════════════════════════════
   AURA SVGs — original stylized elemental decorations
   Each returns SVG markup. viewBox -50 -50 200 200, frame at 0..100,100.
   ════════════════════════════════════════════════════════════ */
const AURAS = {
  fire: (p,s,a) => `
    <defs>
      <radialGradient id="fg-${p.slice(1)}" cx="50%" cy="60%" r="60%">
        <stop offset="0%" stop-color="${a}" stop-opacity=".9"/>
        <stop offset="50%" stop-color="${p}" stop-opacity=".6"/>
        <stop offset="100%" stop-color="${p}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="anim-flicker">
      <path d="M50 -30 Q42 -15 46 -5 Q40 -18 38 -32 Q44 -22 50 -30 Z" fill="${p}" opacity=".85"/>
      <path d="M55 -22 Q60 -10 56 0 Q64 -8 62 -22 Q58 -14 55 -22 Z" fill="${s}" opacity=".75"/>
      <path d="M50 130 Q44 118 48 108 Q40 122 42 134 Q46 124 50 130 Z" fill="${p}" opacity=".7"/>
      <path d="M-22 50 Q-8 42 2 46 Q-12 38 -28 44 Q-18 48 -22 50 Z" fill="${p}" opacity=".85"/>
      <path d="M-15 60 Q-2 56 6 60 Q-8 54 -22 56 Z" fill="${s}" opacity=".7"/>
      <path d="M122 50 Q108 42 98 46 Q112 38 128 44 Q118 48 122 50 Z" fill="${p}" opacity=".85"/>
      <path d="M115 60 Q102 56 94 60 Q108 54 122 56 Z" fill="${s}" opacity=".7"/>
      <circle cx="8" cy="8" r="2" fill="${a}"/>
      <circle cx="92" cy="10" r="1.5" fill="${a}"/>
      <circle cx="6" cy="92" r="1.8" fill="${a}"/>
      <circle cx="94" cy="94" r="2" fill="${a}"/>
    </g>
    <g class="anim-flicker-2" opacity=".6">
      <path d="M50 -42 Q44 -28 48 -18 Q56 -32 52 -46 Q48 -36 50 -42 Z" fill="${a}"/>
      <path d="M-32 50 Q-22 48 -14 52 Q-30 42 -40 50 Z" fill="${a}" opacity=".8"/>
      <path d="M132 50 Q122 48 114 52 Q130 42 140 50 Z" fill="${a}" opacity=".8"/>
    </g>`,

  wind: (p,s,a) => `
    <g class="anim-swirl" fill="none" stroke-linecap="round">
      <path d="M-30 30 Q-10 20 10 28" stroke="${p}" stroke-width="2.5" opacity=".85"/>
      <path d="M-36 50 Q-12 42 8 50" stroke="${s}" stroke-width="2" opacity=".7"/>
      <path d="M-30 70 Q-8 60 10 68" stroke="${p}" stroke-width="2" opacity=".8"/>
      <path d="M90 30 Q110 20 130 28" stroke="${p}" stroke-width="2.5" opacity=".85"/>
      <path d="M92 50 Q116 42 136 50" stroke="${s}" stroke-width="2" opacity=".7"/>
      <path d="M90 70 Q112 60 130 68" stroke="${p}" stroke-width="2" opacity=".8"/>
      <path d="M30 -28 Q40 -10 48 8" stroke="${p}" stroke-width="2.2" opacity=".8"/>
      <path d="M70 -28 Q60 -10 52 8" stroke="${s}" stroke-width="2" opacity=".7"/>
      <path d="M30 128 Q40 110 48 92" stroke="${p}" stroke-width="2" opacity=".7"/>
      <path d="M70 128 Q60 110 52 92" stroke="${s}" stroke-width="2" opacity=".7"/>
    </g>
    <g><circle cx="-12" cy="20" r="1.5" fill="${a}"/><circle cx="112" cy="20" r="1.5" fill="${a}"/>
       <circle cx="-12" cy="80" r="1.5" fill="${a}"/><circle cx="112" cy="80" r="1.5" fill="${a}"/></g>`,

  poison: (p,s,a) => `
    <defs>
      <radialGradient id="tx-${p.slice(1)}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${a}" stop-opacity=".6"/>
        <stop offset="100%" stop-color="${p}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="anim-drift">
      <circle cx="-18" cy="32" r="14" fill="url(#tx-${p.slice(1)})"/>
      <circle cx="-26" cy="56" r="16" fill="url(#tx-${p.slice(1)})"/>
      <circle cx="-20" cy="82" r="13" fill="url(#tx-${p.slice(1)})"/>
      <circle cx="-12" cy="40" r="9" fill="${p}" opacity=".45"/>
      <circle cx="-22" cy="62" r="10" fill="${s}" opacity=".5"/>
      <circle cx="118" cy="32" r="14" fill="url(#tx-${p.slice(1)})"/>
      <circle cx="126" cy="56" r="16" fill="url(#tx-${p.slice(1)})"/>
      <circle cx="120" cy="82" r="13" fill="url(#tx-${p.slice(1)})"/>
      <circle cx="112" cy="40" r="9" fill="${p}" opacity=".45"/>
      <circle cx="122" cy="62" r="10" fill="${s}" opacity=".5"/>
    </g>

  const counterNum = document.getElementById('counter-num');
  const counterTot = document.getElementById('counter-tot');
  const stackTop = document.getElementById('stack-top');
  const stackBot = document.getElementById('stack-bot');
  const auraEl = document.getElementById('aura');
  const portrait = document.getElementById('portrait');
  const rectFrame = document.getElementById('rect-frame');
  const nameplateEl = document.getElementById('nameplate');
  const agentName = document.getElementById('agent-name');
  const agentRole = document.getElementById('agent-role');
  const elementTag = document.getElementById('element-tag');

  let agents = []; // sorted alphabetical for the carousel

  // ── Fetch ──
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    agents = data.data
      .filter(a => a.isPlayableCharacter !== false)
      .map(a => {
        const key = a.displayName.toLowerCase();
        const elem = ELEMENT_MAP[key] || FALLBACK;
        return {
          uuid: a.uuid,
          name: a.displayName,
          role: a.role?.displayName || 'Agent',
          icon: a.displayIcon,
          bust: a.bustPortrait || a.fullPortrait,
          ...elem,
        };
      })
      .sort((a, b) => a.name.localeCompare(b.name));

    loadingEl.classList.add('hidden');
    idleEl.classList.remove('hidden');
  } catch (e) {
    loadingEl.classList.add('hidden');
    errorEl.classList.remove('hidden');
    errorEl.textContent = 'Failed to load agents';
    return;
  }

  // ── BroadcastChannel ──
  const channel = new BroadcastChannel(CHANNEL);
  channel.onmessage = (e) => {
    if (e.data?.type === 'SELECT_AGENT' && e.data.agentUuid) selectAgent(e.data.agentUuid);
  };

  // ── Selection / render ──
  function selectAgent(uuid) {
    const idx = agents.findIndex(a => a.uuid === uuid);
    if (idx < 0) return;
    render(idx);
  }

  function render(idx) {
    const agent = agents[idx];
    const total = agents.length;

    idleEl.classList.add('hidden');
    displayEl.classList.remove('hidden');

    // Set theme variables
    root.style.setProperty('--accent', agent.primary);
    root.style.setProperty('--accent-light', agent.accent);
    root.style.setProperty('--accent-glow', agent.primary + '55');
    root.style.setProperty('--bg-grad', agent.bg);

    // Counter
    counterNum.textContent = String(idx + 1).padStart(2, '0');
    counterTot.textContent = String(total).padStart(2, '0');

    // Carousel context
    const before2 = agents[(idx - 2 + total) % total];
    const before1 = agents[(idx - 1 + total) % total];
    const after1  = agents[(idx + 1) % total];
    const after2  = agents[(idx + 2) % total];

    stackTop.innerHTML = `
      ${chipHtml(before2, 'sm')}
      <div class="hex-sep">▾</div>
      ${chipHtml(before1, 'md')}
      <div class="hex-sep">▾</div>`;
    stackBot.innerHTML = `
      <div class="hex-sep">▾</div>
      ${chipHtml(after1, 'md')}
      <div class="hex-sep">▾</div>
      ${chipHtml(after2, 'sm')}`;

    bindChipClicks();

    // Aura — re-mount to retrigger flash animation
    const auraFn = AURAS[agent.el] || AURAS.fire;
    auraEl.innerHTML = `<svg viewBox="-50 -50 200 200">${auraFn(agent.primary, agent.secondary, agent.accent)}</svg>`;
    auraEl.style.animation = 'none';
    void auraEl.offsetHeight;
    auraEl.style.animation = '';

    // Portrait
    portrait.src = agent.bust;

    // Re-trigger frame burn-in
    rectFrame.style.animation = 'none';
    void rectFrame.offsetHeight;
    rectFrame.style.animation = '';

    // Nameplate
    agentName.textContent = agent.name;
    agentRole.textContent = agent.role.toUpperCase();
    nameplateEl.classList.remove('keyed');
    void nameplateEl.offsetHeight;
    nameplateEl.classList.add('keyed');

    elementTag.textContent = '◈ ' + agent.el.toUpperCase();
    elementTag.style.animation = 'none';
    void elementTag.offsetHeight;
    elementTag.style.animation = '';
  }

  function chipHtml(agent, size) {
    return `<button class="hex-chip size-${size}" data-uuid="${agent.uuid}" aria-label="${agent.name}">
      ${hexSvg(agent.primary, false)}
      <img src="${agent.icon}" alt="">
    </button>`;
  }

  function bindChipClicks() {
    document.querySelectorAll('.hex-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const uuid = btn.dataset.uuid;
        // broadcast so the dock stays in sync too
        channel.postMessage({ type: 'SELECT_AGENT', agentUuid: uuid });
        selectAgent(uuid);
      });
    });
  }
})();
</script>
</body>
</html>
