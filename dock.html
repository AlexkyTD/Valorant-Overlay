<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT Overlay — Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --val-red: #FF4655;
    --val-bg: #0F1923;
    --val-bg-2: #141D27;
    --val-bg-3: #1A2332;
    --val-cream: #ECE8E1;
    --val-line: rgba(236,232,225,0.1);
    --green: #4CAF50;
    --amber: #E8A838;
  }

  html, body {
    width: 280px;
    height: 720px;
    overflow: hidden;
    background: var(--val-bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--val-cream);
    user-select: none;
  }

  .dock {
    width: 280px;
    height: 720px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ─────────── Header (sticky-ish) ─────────── */
  .head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    height: 44px;
    background: var(--val-bg-2);
    border-bottom: 1px solid var(--val-line);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-logo {
    width: 22px; height: 22px;
    border: 2px solid var(--val-red);
    transform: rotate(45deg);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-logo span {
    transform: rotate(-45deg);
    font-weight: 700; font-size: 8px;
    letter-spacing: 0.05em; color: var(--val-red);
  }
  .brand-title {
    font-weight: 700; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .brand-title b { color: var(--val-red); }

  .live {
    display: flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.18em;
    color: rgba(236,232,225,0.5);
    visibility: hidden;
  }
  .live.on { visibility: visible; }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ─────────── Scroll area ─────────── */
  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,70,85,0.3) transparent;
  }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(255,70,85,0.3); border-radius: 3px; }

  /* ─────────── Toolbar (sort + search stacked) ─────────── */
  .tool {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px;
    background: #111A24;
    border-bottom: 1px solid var(--val-line);
  }
  .seg {
    display: flex;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--val-line);
    border-radius: 3px;
    overflow: hidden;
  }
  .seg-btn {
    flex: 1;
    appearance: none;
    background: transparent;
    border: 0;
    color: rgba(236,232,225,0.55);
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 0;
    cursor: pointer;
    transition: all 0.15s ease;
    border-right: 1px solid var(--val-line);
  }
  .seg-btn:last-child { border-right: 0; }
  .seg-btn:hover { color: var(--val-cream); background: rgba(255,255,255,0.04); }
  .seg-btn.active { background: var(--val-red); color: #fff; }

  .search-wrap { position: relative; }
  .search-input {
    width: 100%;
    appearance: none;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--val-line);
    color: var(--val-cream);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    padding: 7px 11px 7px 30px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input::placeholder { color: rgba(236,232,225,0.3); }
  .search-input:focus { border-color: rgba(255,70,85,0.5); }
  .search-icon {
    position: absolute;
    left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px;
    color: rgba(236,232,225,0.3);
    pointer-events: none;
  }
  .search-results {
    position: absolute;
    top: calc(100% + 4px); left: 0; right: 0;
    background: #0E1620;
    border: 1px solid var(--val-line);
    border-radius: 3px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 30;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .search-results.open { display: block; }
  .search-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid rgba(236,232,225,0.04);
  }
  .search-item:last-child { border-bottom: 0; }
  .search-item:hover, .search-item.focused { background: rgba(255,70,85,0.12); }
  .search-item img { width: 22px; height: 22px; object-fit: contain; }
  .search-item .si-name {
    font-weight: 600; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .search-item .si-role {
    margin-left: auto;
    font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(236,232,225,0.5);
  }

  /* ─────────── Preview card (now-playing) ─────────── */
  .preview {
    padding: 22px 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--val-line);
  }
  .preview-img-wrap {
    position: relative;
    width: 150px; height: 200px;
    border: 2px solid var(--val-red);
    border-radius: 3px;
    overflow: hidden;
    background: linear-gradient(180deg, #1a2332, #0a0e14);
    box-shadow: 0 4px 22px rgba(0,0,0,0.55);
  }
  .preview-img-wrap.empty::before {
    content: '?';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 700;
    color: rgba(255,70,85,0.2);
  }
  .preview-img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    transform: scale(1.4);
    transform-origin: 50% 22%;
    display: block;
  }
  .preview-img.hidden { display: none; }
  .preview-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px; background: var(--val-red);
  }

  .preview-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
  }
  .preview-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em;
    color: rgba(236,232,225,0.4);
  }
  .preview-counter b { color: var(--val-red); }
  .preview-name {
    font-weight: 700; font-size: 26px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--val-cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
  }
  .preview-role {
    font-weight: 600; font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--val-red);
    margin-top: 1px;
  }

  /* ─────────── Nav (prev / next side by side) ─────────── */
  .nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 12px 14px;
    background: var(--val-bg);
  }
  .nav-btn {
    appearance: none;
    background: rgba(255,70,85,0.08);
    border: 1px solid rgba(255,70,85,0.4);
    color: var(--val-red);
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 9px 0;
    border-radius: 3px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: all 0.15s ease;
  }
  .nav-btn:hover:not(:disabled) { background: var(--val-red); color: #fff; }
  .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .nav-btn svg { width: 13px; height: 13px; }

  /* ─────────── Options ─────────── */
  .opts {
    padding: 14px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--val-bg-2);
    border-top: 1px solid var(--val-line);
  }
  .opts-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--val-red);
    margin-bottom: 4px;
  }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--val-line);
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .opt:hover { border-color: rgba(236,232,225,0.2); }
  .opt-box {
    width: 15px; height: 15px;
    border: 1.5px solid rgba(236,232,225,0.4);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .opt-box::after {
    content: '✓';
    color: #fff;
    font-size: 11px; font-weight: 700;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .opt-text {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .opt-name {
    font-weight: 700; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--val-cream);
  }
  .opt-desc {
    font-size: 11px;
    color: rgba(236,232,225,0.5);
    line-height: 1.3;
  }
  .opt[data-key="blur"].on { background: rgba(255,70,85,0.1); border-color: rgba(255,70,85,0.5); }
  .opt[data-key="blur"].on .opt-box { background: var(--val-red); border-color: var(--val-red); }
  .opt[data-key="played"].on { background: rgba(76,175,80,0.1); border-color: rgba(76,175,80,0.5); }
  .opt[data-key="played"].on .opt-box { background: var(--green); border-color: var(--green); }
  .opt[data-key="queued"].on { background: rgba(232,168,56,0.1); border-color: rgba(232,168,56,0.5); }
  .opt[data-key="queued"].on .opt-box { background: var(--amber); border-color: var(--amber); }
  .opt.on .opt-box::after { opacity: 1; }

  /* ─────────── Loading / Error ─────────── */
  .loading-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    background: var(--val-bg);
    z-index: 50;
  }
  .loading-overlay.hidden { display: none; }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid rgba(255,70,85,0.2);
    border-top-color: var(--val-red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay .text {
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(236,232,225,0.4);
  }
  .error-banner {
    position: absolute; top: 44px; left: 0; right: 0;
    padding: 8px 14px;
    background: rgba(255,70,85,0.1);
    border-bottom: 1px solid rgba(255,70,85,0.2);
    text-align: center;
    font-size: 11px; color: var(--val-red);
    display: none; z-index: 40;
  }
  .error-banner.visible { display: block; }
</style>
</head>
<body>
<div class="dock">

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="text">Loading agents...</div>
  </div>

  <div class="error-banner" id="error"></div>

  <header class="head">
    <div class="brand">
      <div class="brand-logo"><span>VAL</span></div>
      <div class="brand-title"><b>VAL</b> CONTROL</div>
    </div>
    <div class="live" id="live"><div class="live-dot"></div>LIVE</div>
  </header>

  <div class="scroll">

    <div class="tool">
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-sort="alpha" title="Alphabetical">A→Z</button>
        <button class="seg-btn" data-sort="release" title="Release order">REL</button>
        <button class="seg-btn" data-sort="role" title="By role">ROLE</button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search-input" type="text" placeholder="Type to jump..." id="search" autocomplete="off">
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <div class="preview">
      <div class="preview-img-wrap empty" id="preview-wrap">
        <img class="preview-img hidden" id="preview-img" alt="">
        <div class="preview-bar"></div>
      </div>
      <div class="preview-meta">
        <div class="preview-counter">
          <b id="counter-num">--</b> / <span id="counter-tot">--</span>
        </div>
        <div class="preview-name" id="preview-name">No agent</div>
        <div class="preview-role" id="preview-role">—</div>
      </div>
    </div>

    <div class="nav">
      <button class="nav-btn" id="prev-btn" title="Previous (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Prev
      </button>
      <button class="nav-btn" id="next-btn" title="Next (→)">
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="opts">
      <div class="opts-title">Display Options</div>

      <label class="opt" data-key="blur" title="Blur the next agent's hex chip on the overlay so viewers can't see what's coming.">
        <span class="opt-box"></span>
        <span class="opt-text">
          <span class="opt-name">Blur Next</span>
          <span class="opt-desc">Hide the upcoming agent on the overlay's next hex chip.</span>
        </span>
      </label>

      <label class="opt" data-key="played" title="Show a green ✓ on the previous hex chip — marks the just-played agent as done.">
        <span class="opt-box"></span>
        <span class="opt-text">
          <span class="opt-name">Mark Previous Played</span>
          <span class="opt-desc">Green ✓ + green border on the agent you just left.</span>
        </span>
      </label>

      <label class="opt" data-key="queued" title="Show an amber ⏳ on the next hex chip — flags the upcoming agent.">
        <span class="opt-box"></span>
        <span class="opt-text">
          <span class="opt-name">Queue Next</span>
          <span class="opt-desc">Amber ⏳ on the next agent in the carousel.</span>
        </span>
      </label>
    </div>

  </div>
</div>

<script>
(async function () {
  const API_URL = 'https://valorant-api.com/v1/agents?isPlayableCharacter=true';
  const CHANNEL_NAME = 'valorant-overlay';
  const ROLE_ORDER = ['Duelist', 'Initiator', 'Controller', 'Sentinel'];
  const ROLE_COLORS = { Duelist: '#FF4655', Initiator: '#E8A838', Controller: '#9B59B6', Sentinel: '#3498DB' };

  const CUSTOM_AGENTS = [];

  // ── Persistent state ──
  const STORAGE_KEY = 'valorant-overlay:state';
  const DEFAULT_STATE = {
    sort: 'alpha',
    selectedByCategory: {},
    opts: { blur: false, played: false, queued: false },
  };
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { ...DEFAULT_STATE };
      const p = JSON.parse(raw);
      return {
        ...DEFAULT_STATE,
        ...p,
        selectedByCategory: { ...DEFAULT_STATE.selectedByCategory, ...(p.selectedByCategory || {}) },
        opts: { ...DEFAULT_STATE.opts, ...(p.opts || {}) },
      };
    } catch { return { ...DEFAULT_STATE }; }
  }
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        sort: currentSort, selectedByCategory, opts,
      }));
    } catch {}
  }

  const state = loadState();
  let currentSort = state.sort;
  const selectedByCategory = state.selectedByCategory;
  const opts = state.opts;

  const $ = (id) => document.getElementById(id);
  const loadingEl = $('loading'), errorEl = $('error'), liveEl = $('live');
  const previewWrap = $('preview-wrap'), previewImg = $('preview-img');
  const previewName = $('preview-name'), previewRole = $('preview-role');
  const counterNum = $('counter-num'), counterTot = $('counter-tot');
  const searchInput = $('search'), searchResults = $('search-results');
  const prevBtn = $('prev-btn'), nextBtn = $('next-btn');

  let agentsRelease = [];
  let selectedUuid = null;

  const channel = new BroadcastChannel(CHANNEL_NAME);
  channel.onmessage = (e) => {
    if (e.data?.type === 'SELECT_AGENT' && e.data.agentUuid) {
      applySelection(e.data.agentUuid, false);
    }
  };

  // ── Fetch ──
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    agentsRelease = [...data.data, ...CUSTOM_AGENTS].map(a => ({
      uuid: a.uuid,
      name: a.displayName,
      role: a.role?.displayName || 'Unknown',
      icon: a.displayIcon,
      bust: a.bustPortrait || a.fullPortrait,
      colors: (a.backgroundGradientColors || []).map(c => '#' + c.substring(0, 6)),
    }));
    loadingEl.classList.add('hidden');
    counterTot.textContent = String(agentsRelease.length).padStart(2, '0');

    document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === currentSort));
    document.querySelectorAll('.opt').forEach(el => el.classList.toggle('on', !!opts[el.dataset.key]));

    channel.postMessage({ type: 'SET_SORT', sort: currentSort });
    broadcastOptions();

    const sorted = getSortedAgents();
    const savedUuid = selectedByCategory[currentSort];
    if (savedUuid && agentsRelease.some(a => a.uuid === savedUuid)) applySelection(savedUuid);
    else if (sorted.length > 0) applySelection(sorted[0].uuid);
    else updateNav();
  } catch (err) {
    loadingEl.classList.add('hidden');
    errorEl.textContent = 'Failed to load agents.';
    errorEl.classList.add('visible');
    return;
  }

  function getSortedAgents() {
    const list = agentsRelease.slice();
    if (currentSort === 'alpha') list.sort((a,b) => a.name.localeCompare(b.name));
    else if (currentSort === 'role') {
      list.sort((a,b) => {
        const ri = ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role);
        return ri !== 0 ? ri : a.name.localeCompare(b.name);
      });
    }
    return list;
  }

  function applySelection(uuid, broadcast = true) {
    const agent = agentsRelease.find(a => a.uuid === uuid);
    if (!agent) return;
    selectedUuid = uuid;
    selectedByCategory[currentSort] = uuid;
    saveState();
    if (broadcast) channel.postMessage({ type: 'SELECT_AGENT', agentUuid: uuid });

    previewWrap.classList.remove('empty');
    previewImg.src = agent.bust || agent.icon;
    previewImg.classList.remove('hidden');
    previewName.textContent = agent.name;
    previewRole.textContent = agent.role;
    previewRole.style.color = ROLE_COLORS[agent.role] || 'var(--val-red)';

    const sorted = getSortedAgents();
    const idx = sorted.findIndex(a => a.uuid === uuid);
    counterNum.textContent = idx >= 0 ? String(idx + 1).padStart(2, '0') : '--';

    liveEl.classList.add('on');
    updateNav();
  }

  function updateNav() {
    const sorted = getSortedAgents();
    const idx = sorted.findIndex(a => a.uuid === selectedUuid);
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx < 0 || idx >= sorted.length - 1;
  }

  function broadcastOptions() {
    channel.postMessage({ type: 'SET_OPTIONS', opts: { ...opts } });
  }

  // ── Sort ──
  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const newSort = btn.dataset.sort;
      if (newSort === currentSort) return;
      currentSort = newSort;
      saveState();
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      channel.postMessage({ type: 'SET_SORT', sort: currentSort });
      const sorted = getSortedAgents();
      const savedUuid = selectedByCategory[currentSort];
      if (savedUuid && agentsRelease.some(a => a.uuid === savedUuid)) applySelection(savedUuid);
      else if (sorted.length > 0) applySelection(sorted[0].uuid);
      else updateNav();
    });
  });

  // ── Prev / Next ──
  prevBtn.addEventListener('click', () => {
    const sorted = getSortedAgents();
    const idx = sorted.findIndex(a => a.uuid === selectedUuid);
    if (idx > 0) applySelection(sorted[idx - 1].uuid);
    else if (idx < 0 && sorted.length > 0) applySelection(sorted[0].uuid);
  });
  nextBtn.addEventListener('click', () => {
    const sorted = getSortedAgents();
    const idx = sorted.findIndex(a => a.uuid === selectedUuid);
    if (idx >= 0 && idx < sorted.length - 1) applySelection(sorted[idx + 1].uuid);
    else if (idx < 0 && sorted.length > 0) applySelection(sorted[0].uuid);
  });
  document.addEventListener('keydown', (e) => {
    if (document.activeElement === searchInput) return;
    if (e.key === 'ArrowLeft') prevBtn.click();
    else if (e.key === 'ArrowRight') nextBtn.click();
  });

  // ── Search type-ahead ──
  let focusedItemIdx = -1;
  function renderSearch() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; focusedItemIdx = -1; return; }
    const matches = agentsRelease
      .filter(a => a.name.toLowerCase().includes(q))
      .sort((a,b) => a.name.localeCompare(b.name))
      .slice(0, 8);
    if (matches.length === 0) { searchResults.classList.remove('open'); searchResults.innerHTML = ''; focusedItemIdx = -1; return; }
    searchResults.innerHTML = matches.map((a, i) => `
      <div class="search-item${i === 0 ? ' focused' : ''}" data-uuid="${a.uuid}">
        <img src="${a.icon}" alt="">
        <div class="si-name">${a.name}</div>
        <div class="si-role" style="color:${ROLE_COLORS[a.role] || 'var(--val-red)'}">${a.role}</div>
      </div>`).join('');
    focusedItemIdx = 0;
    searchResults.classList.add('open');
    searchResults.querySelectorAll('.search-item').forEach((el, i) => {
      el.addEventListener('mouseenter', () => {
        searchResults.querySelectorAll('.search-item').forEach(x => x.classList.remove('focused'));
        el.classList.add('focused');
        focusedItemIdx = i;
      });
      el.addEventListener('click', () => {
        applySelection(el.dataset.uuid);
        searchInput.value = '';
        searchResults.classList.remove('open');
        searchInput.blur();
      });
    });
  }
  searchInput.addEventListener('input', renderSearch);
  searchInput.addEventListener('keydown', (e) => {
    const items = searchResults.querySelectorAll('.search-item');
    if (e.key === 'Enter') {
      e.preventDefault();
      if (items.length > 0) {
        const target = items[focusedItemIdx] || items[0];
        applySelection(target.dataset.uuid);
        searchInput.value = '';
        searchResults.classList.remove('open');
        searchInput.blur();
      }
    } else if (e.key === 'Escape') {
      searchInput.value = ''; searchResults.classList.remove('open'); searchInput.blur();
    } else if (e.key === 'ArrowDown' && items.length > 0) {
      e.preventDefault();
      focusedItemIdx = Math.min(focusedItemIdx + 1, items.length - 1);
      items.forEach(x => x.classList.remove('focused'));
      items[focusedItemIdx].classList.add('focused');
    } else if (e.key === 'ArrowUp' && items.length > 0) {
      e.preventDefault();
      focusedItemIdx = Math.max(focusedItemIdx - 1, 0);
      items.forEach(x => x.classList.remove('focused'));
      items[focusedItemIdx].classList.add('focused');
    }
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
  });

  // ── Option toggles ──
  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      opts[key] = !opts[key];
      el.classList.toggle('on', opts[key]);
      saveState();
      broadcastOptions();
    });
  });
})();
</script>
</body>
</html>
